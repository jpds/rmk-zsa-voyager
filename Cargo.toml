[package]
name = "rmk-zsa-voyager"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
rmk = { path = "dependencies/rmk/rmk", default-features = false, features = ["storage", "watchdog", "zsa_voyager_bl", "lighting"] }

embassy-stm32 = { version = "0.6", features = [
    "stm32f303cb",
    "time-driver-tim15",
    "exti",
    "unstable-pac",
] }
embassy-executor = { version = "0.10", features = [
    "platform-cortex-m",
    "executor-thread",
    "executor-interrupt",
] }
embassy-time = { version = "0.5", features = ["tick-hz-32_768"] }
embassy-sync = "0.8"

rmk-palettefx = { path = "dependencies/rmk-palettefx", features = ["rmk-lighting"] }

cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"

defmt = "1.0"
panic-halt = "1.0"

[features]
default = []
# On-the-fly configuration over the Rynk protocol. Off by default: the Rynk
# dispatch surface adds ~80 KB of code and does not fit the F303's 128 KB
# flash alongside the rest of the firmware (measured: 183 KB vs the 116 KB
# usable region). Kept as a feature so the wiring stays exercised and the
# build can be revisited when rmk gains size-trimming options.
rynk = ["rmk/rynk"]

# rmk-palettefx's adapter names the fork by git URL; resolve it to the same
# vendored submodule this firmware builds against.
[patch."https://github.com/colonelpanic8/rmk"]
rmk = { path = "dependencies/rmk/rmk" }

[[bin]]
name = "rmk-zsa-voyager"
test = false
bench = false

[profile.dev]
codegen-units = 1
debug = true
opt-level = "s"
overflow-checks = true
lto = "fat"
panic = "unwind"

[profile.release]
codegen-units = 1
debug = true
panic = "abort"
opt-level = "z"
overflow-checks = false
lto = "fat"
